name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # The reading ledger names an immutable earlier source commit.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test evidence-ledger validation
        run: python3 -m unittest discover -s scripts -p test_corpus_audit.py
      - name: Check complete source accounting and generated inventory
        run: python3 scripts/corpus_audit.py check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Python runtime dependencies (numpy + CPU torch, matplotlib for paper figures)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy matplotlib --extra-index-url https://download.pytorch.org/whl/cpu torch

      - name: C2 invariants (Python + C11 header conformance)
        run: python3 -m unittest discover -s weft/runtime/invariants -p 'test_*.py'
      - name: C1 plasm (shared memory, A/B mitosis)
        run: python3 -m unittest discover -s weft/runtime/plasm -p 'test_*.py'
      - name: C3 interaction-combinator VM and BCP codec
        run: python3 -m unittest discover -s weft/runtime/ic -p 'test_*.py'
      - name: C6 telemetry
        run: python3 -m unittest discover -s weft/runtime/telemetry -p 'test_*.py'
      - name: C4/C5 ledger simulator and gateway
        run: python3 -m unittest discover -s weft/runtime/gateway -p 'test_*.py'
      - name: C7 Aywa (Python)
        run: python3 -m unittest discover -s weft/runtime/aywa -p 'test_*.py'
      - name: C7 Aywa and site modules (Node)
        run: node --test weft/runtime/aywa/test_*.mjs
      - name: Aywa daemon self-test
        run: python3 weft/runtime/aywa/weft_daemon.py --self-test
      - name: Site self-test (w3ft.org bundle in site/)
        run: python3 weft/runtime/aywa/site_selftest.py
      - name: Core and Mac runtime self-tests
        run: |
          python3 weft/runtime/core/selftest.py
          python3 weft/runtime/mac/darwin_sysctl.py
          python3 weft/runtime/mac/metal_loom.py
      - name: Paper 1 experiments reproduce the published numbers
        run: python3 papers/01-models-as-cells/experiments.py --check
      - name: Assert clean working tree after all self-tests
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pandoc and PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          pandoc --version | head -1
          python3 -m pip install pyyaml
      - name: Paper HTML is current and PDFs were built from current sources
        run: python3 scripts/build_papers.py --check

  telemetry-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned browser test dependencies
        run: |
          python3 -m pip install -r scripts/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Test telemetry worker refresh, rejection, and recovery
        run: python3 scripts/test_telemetry_browser.py
