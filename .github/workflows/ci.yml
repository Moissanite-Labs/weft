name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The reading ledger names an immutable earlier source commit.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test evidence-ledger validation
        run: python3 -m unittest discover -s scripts -p test_corpus_audit.py
      - name: Check complete source accounting and generated inventory
        run: python3 scripts/corpus_audit.py check

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install Python runtime dependencies (numpy + CPU torch, matplotlib for paper figures)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements-ci.txt

      - name: C2 invariants (Python + C11 header conformance)
        run: python3 -m unittest discover -s weft/runtime/invariants -p 'test_*.py'
      - name: C1 plasm (shared memory, A/B mitosis)
        run: python3 -m unittest discover -s weft/runtime/plasm -p 'test_*.py'
      - name: C3 interaction-combinator VM and BCP codec
        run: python3 -m unittest discover -s weft/runtime/ic -p 'test_*.py'
      - name: C6 telemetry
        run: python3 -m unittest discover -s weft/runtime/telemetry -p 'test_*.py'
      - name: C4/C5 ledger simulator and gateway
        run: python3 -m unittest discover -s weft/runtime/gateway -p 'test_*.py'
      - name: C7 Aywa (Python)
        run: python3 -m unittest discover -s weft/runtime/aywa -p 'test_*.py'
      - name: C7 Aywa and site modules (Node)
        run: node --test weft/runtime/aywa/test_*.mjs
      - name: Aywa daemon self-test
        run: python3 weft/runtime/aywa/weft_daemon.py --self-test
      - name: Site self-test (w3ft.org bundle in site/)
        run: python3 weft/runtime/aywa/site_selftest.py
      - name: Core and Mac runtime self-tests
        run: |
          python3 weft/runtime/core/selftest.py
          python3 weft/runtime/mac/darwin_sysctl.py
          python3 weft/runtime/mac/metal_loom.py
      - name: Mac swarm loom tests
        run: python3 -m unittest discover -s weft/runtime/mac -p 'test_*.py'
      - name: Paper 1 experiments reproduce the published numbers
        run: python3 papers/01-models-as-cells/experiments.py --check
      - name: Paper 2 experiments reproduce the published numbers
        run: python3 papers/02-checkable-computation/experiments.py --check
      - name: Assert clean working tree after all self-tests
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  plasm-macos:
    # Apple Silicon is the first hardware target, and POSIX shared memory differs
    # there (30-byte names, #68). Runs the shared-memory runtime on macOS arm64.
    # Not yet a required check; promote it in .github/rulesets/main.json once stable.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install numpy and torch
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/requirements-ci.txt
      - name: C2 invariants
        run: python3 -m unittest discover -s weft/runtime/invariants -p 'test_*.py'
      - name: C1 plasm (shared memory, A/B mitosis)
        run: python3 -m unittest discover -s weft/runtime/plasm -p 'test_*.py'
      - name: Mac harness
        run: |
          python3 weft/runtime/mac/darwin_sysctl.py
          python3 weft/runtime/mac/metal_loom.py
          python3 -m unittest discover -s weft/runtime/mac -p 'test_*.py'
      - name: Tree is clean after the run
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pandoc 3.1.3 (pinned) and PyYAML
        # The committed HTML is pandoc output, and pandoc's markup changes between
        # releases (MathML, table row classes), so CI uses the exact release the
        # pages were generated with. Keep in step with PANDOC_VERSION in
        # scripts/build_papers.py.
        env:
          PANDOC_DEB: pandoc-3.1.3-1-amd64.deb
          PANDOC_SHA256: caa7e0410f9e2cb1da2eb8db13cc97b5548fe455985e2c944e3929d22f99bcdc
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/$PANDOC_DEB" "https://github.com/jgm/pandoc/releases/download/3.1.3/$PANDOC_DEB"
          echo "$PANDOC_SHA256  $RUNNER_TEMP/$PANDOC_DEB" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$PANDOC_DEB"
          pandoc --version | head -1
          python3 -m pip install pyyaml
      - name: Zenodo and citation metadata agree, and every paper has a PDF
        run: python3 scripts/zenodo_metadata.py --check
      - name: Paper HTML is current and PDFs were built from current sources
        run: python3 scripts/build_papers.py --check
      - name: condensed.json still matches the overview page
        run: python3 scripts/check_condensed.py

  siliconcordat-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Build ml-siliconcordat dist/
        run: python3 scripts/build_siliconcordat_bundle.py
      - name: Verify ml-siliconcordat bundle
        run: python3 scripts/verify_siliconcordat_bundle.py
      - name: ml-siliconcordat redirect rules
        run: node --test workers/test_siliconcordat.mjs

  siliconcordat-cut-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Build ml-siliconcordat-cut dist-cut/ (staging preview)
        run: SILICONCORDAT_CUT_HOST=staging python3 scripts/build_siliconcordat_cut_bundle.py
      - name: Verify ml-siliconcordat-cut bundle (staging)
        run: SILICONCORDAT_CUT_HOST=staging python3 scripts/verify_siliconcordat_cut_bundle.py
      - name: Verify ml-siliconcordat-cut production build omits noindex
        run: |
          SILICONCORDAT_CUT_HOST=production python3 scripts/build_siliconcordat_cut_bundle.py
          SILICONCORDAT_CUT_HOST=production python3 scripts/verify_siliconcordat_cut_bundle.py
      - name: ml-siliconcordat-cut redirect rules
        run: node --test workers/test_siliconcordat-cut.mjs

  telemetry-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned browser test dependencies
        run: |
          python3 -m pip install -r scripts/requirements-browser.txt
          python3 -m playwright install --with-deps chromium
      - name: Test telemetry worker refresh, rejection, and recovery
        run: python3 scripts/test_telemetry_browser.py


  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test the link checker
        run: python3 -m unittest discover -s scripts -p test_check_links.py
      - name: Check repo links in README and site files
        run: python3 scripts/check_links.py

  secret-scan:
    # Entropy-aware scan of the history that would ship (#73). The
    # gitleaks action needs a licence key for organisation repos, so the
    # job runs the open-source binary instead, pinned by version and
    # SHA-256 like the pandoc install in the papers job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0 (pinned)
        env:
          GITLEAKS_TGZ: gitleaks_8.28.0_linux_x64.tar.gz
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$GITLEAKS_TGZ" "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/$GITLEAKS_TGZ"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$GITLEAKS_TGZ" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$GITLEAKS_TGZ" -C "$RUNNER_TEMP"
      - name: Scan git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --verbose --redact'
