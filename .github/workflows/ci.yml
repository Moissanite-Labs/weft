name: Weft Runtime & Surface CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  corpus-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The reading ledger names an immutable earlier source commit.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test evidence-ledger validation
        run: python3 -m unittest discover -s scripts -p test_corpus_audit.py
      - name: Check complete source accounting and generated inventory
        run: python3 scripts/corpus_audit.py check

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python runtime dependencies (numpy + CPU torch)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy --extra-index-url https://download.pytorch.org/whl/cpu torch

      - name: Run C2 Invariants unit and C11 header conformance tests
        run: python3 -m unittest discover -s weft/runtime/invariants -p 'test_*.py'

      - name: Run C1 Plasm shared-memory and mitosis unit tests
        run: python3 -m unittest discover -s weft/runtime/plasm -p 'test_*.py'

      - name: Run C3 Interaction Combinator VM and BCP codec unit tests
        run: python3 -m unittest discover -s weft/runtime/ic -p 'test_*.py'

      - name: Run C6 Host and organization telemetry unit tests
        run: python3 -m unittest discover -s weft/runtime/telemetry -p 'test_*.py'

      - name: Run C4/C5 Ledger triad and off-chain gateway unit tests
        run: python3 -m unittest discover -s weft/runtime/gateway -p 'test_*.py'

      - name: Run C7 Aywa SYM-2P Python unit tests
        run: python3 -m unittest discover -s weft/runtime/aywa -p 'test_*.py'

      - name: Run C7 Aywa Node.js tests (SYM-2P, mixer, atlas, cell layout, glyph font, simplex pad)
        run: node --test weft/runtime/aywa/test_sym2p_parse.mjs weft/runtime/aywa/test_aesthetic_mixer.mjs weft/runtime/aywa/test_weft_atlas.mjs weft/runtime/aywa/test_cell_layout.mjs weft/runtime/aywa/test_glyph_font.mjs weft/runtime/aywa/test_simplex_pad.mjs weft/runtime/aywa/test_weft_loom_pack.mjs

      - name: Run Aywa daemon self-test (no tracked file dirtiness)
        run: python3 weft/runtime/aywa/weft_daemon.py --self-test

      - name: Run Pages seed and allow-list staging self-test
        run: python3 weft/runtime/aywa/site_selftest.py

      - name: Run Core and Mac runtime selftests
        run: |
          python3 weft/runtime/core/selftest.py
          python3 weft/runtime/mac/darwin_sysctl.py
          python3 weft/runtime/mac/metal_loom.py

      - name: Assert clean working tree after all self-tests
        run: test -z "$(git status --porcelain)"

  telemetry-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned browser test dependencies
        run: |
          python3 -m pip install -r scripts/requirements-browser.txt
          python3 -m playwright install --with-deps chromium

      - name: Test telemetry worker refresh, rejection, and recovery
        run: python3 scripts/test_telemetry_browser.py
