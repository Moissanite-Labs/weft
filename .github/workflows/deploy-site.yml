name: Deploy site

# Publishes site/ to w3ft.org via the Cloudflare Worker "ml-weft" (wrangler.jsonc).
# Runs only when the repository variable SITE_DEPLOY_ENABLED is "true" and the
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set. Deploys go
# through the "production" environment so you can require an approval.
on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://w3ft.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Site self-test
        run: python3 weft/runtime/aywa/site_selftest.py
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
