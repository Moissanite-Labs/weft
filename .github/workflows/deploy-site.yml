name: Deploy site

# Publishes site/ to w3ft.org via the Cloudflare Worker "ml-weft" (wrangler.jsonc).
# Runs only when the repository variable SITE_DEPLOY_ENABLED is "true" and the
# secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set. Deploys go
# through the "production" environment so you can require an approval.
on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc", ".github/workflows/deploy-site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://w3ft.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Site self-test
        run: python3 weft/runtime/aywa/site_selftest.py
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
