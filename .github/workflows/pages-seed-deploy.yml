name: Prepare Weft Pages seed (manual only)
# Gated: workflow_dispatch only so merging cannot publish while GitHub Pages is off.

on:
  workflow_dispatch:
    inputs:
      note:
        description: Optional operator note
        required: false
        default: manual-pages-sync

permissions:
  contents: read

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python runtime dependencies (numpy + CPU torch)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy --extra-index-url https://download.pytorch.org/whl/cpu torch

      - name: Sync static seed artifacts into docs/ and stage allow-listed dist/
        run: python3 scripts/sync_pages_seed.py --stage-dist dist

      - name: Site selftest (verifies allow-listed dist/ excludes internal docs)
        run: python3 weft/runtime/aywa/site_selftest.py

      - name: Core corpus selftest
        run: python3 weft/runtime/core/selftest.py

      - name: Upload Pages seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: weft-pages-seed
          path: dist/
