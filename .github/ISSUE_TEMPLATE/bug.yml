name: Bug
description: Code, a test or the website does something wrong.
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: For example C2 invariants, C3 ic, site, or scripts.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, inputs or a minimal test. A failing test is ideal.
      render: shell
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Commit SHA, OS and architecture, and Python, Node and Torch versions (plus browser for the site).
    validations:
      required: true
