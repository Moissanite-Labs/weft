# Gitleaks config for the secret-scan CI job (#73).
#
# gitleaks v8 replaces its default rule set when a config file is present,
# so this file must extend the defaults; without [extend] the scan loads
# zero rules and passes on anything (#100 review).
[extend]
useDefault = true

# Commit a18e0ff2 ("Adding recompiled weft corpus") imported design docs
# that carry test vectors: a repeating placeholder private key
# (MOCK_PRIVATE_KEY), a fixed example token address, and two test
# passphrases. They are fixtures, not credentials, and they produce all 28
# history findings. The allowlist is scoped to that one commit, so the same
# strings added anywhere else are still reported, and the values themselves
# are not repeated here.
# grk-proof triaged all 11 hits as false positives (10 file SHA-256 digests plus 1 prompt_cache_key fixture id).
[[allowlists]]
description = "Corpus import test vectors (a18e0ff2), not real secrets."
commits = [
    "a18e0ff2a583366709e7bc507b780ee914cb233c",
    "09d1e3cadba1d3b2bad480a3f96dd075e9300a67",
    "f2a72fdc0fa8b859df6ccc98e41d0420e86cddbf",
]
