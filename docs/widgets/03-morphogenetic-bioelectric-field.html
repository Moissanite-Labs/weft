<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Morphogenetic bioelectric field</title>
<style>body{margin:0;background:#050505;color:#d1fae5;font:12px monospace}canvas{display:block;width:100%;height:100vh}</style></head><body>
<canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let t=0;
function frame(){c.width=innerWidth;c.height=innerHeight;t+=0.015;x.fillStyle='#050505';x.fillRect(0,0,c.width,c.height);
const g=c.width/40;for(let y=0;y<c.height;y+=g)for(let i=0;i<c.width;i+=g){const v=Math.sin(i*.02+t)*Math.cos(y*.02-t*.6);x.fillStyle=`rgba(${40+v*80|0},${200+v*40|0},${140+v*30|0},.35)`;x.fillRect(i,y,g-1,g-1);} 
x.fillStyle='#a7f3d0';x.fillText('morphogenetic / bioelectric field (design metaphor)',16,24);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
